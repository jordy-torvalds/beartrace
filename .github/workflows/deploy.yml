name: Deploy encrypted dashboard to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Projection date (YYYY-MM-DD); defaults to current UTC date
        required: false
        type: string
  repository_dispatch:
    types: [ledger-updated]
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "apps/**"
      - "config/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: beartrace-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check required deployment configuration
        env:
          LEDGER_REPOSITORY: ${{ vars.BEARTRACE_LEDGER_REPOSITORY }}
          LEDGER_READ_TOKEN: ${{ secrets.BEARTRACE_LEDGER_READ_TOKEN }}
          DASHBOARD_PASSPHRASE: ${{ secrets.BEARTRACE_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEDGER_REPOSITORY" || { echo "Missing variable: BEARTRACE_LEDGER_REPOSITORY"; exit 1; }
          test -n "$LEDGER_READ_TOKEN" || { echo "Missing secret: BEARTRACE_LEDGER_READ_TOKEN"; exit 1; }
          test -n "$DASHBOARD_PASSPHRASE" || { echo "Missing secret: BEARTRACE_PASSPHRASE"; exit 1; }

      - name: Check out public BearTrace engine
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out private learning ledger
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.BEARTRACE_LEDGER_REPOSITORY }}
          ref: ${{ github.event.client_payload.ledger_sha || 'main' }}
          token: ${{ secrets.BEARTRACE_LEDGER_READ_TOKEN }}
          path: .beartrace-ledger
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm test && pnpm validate:examples

      - name: Select projection date
        id: date
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        shell: bash
        run: |
          set -euo pipefail
          value="$REQUESTED_AS_OF"
          if [ -z "$value" ]; then value="$(date -u +%F)"; fi
          if ! [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "as_of must use YYYY-MM-DD"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Validate private ledger without exposing diagnostics
        shell: bash
        run: |
          set -euo pipefail
          if ! pnpm --filter @beartrace/cli exec node dist/cli.js validate \
            --root ../../.beartrace-ledger >"$RUNNER_TEMP/ledger-validation.log" 2>&1; then
            echo "Private ledger validation failed. Run the validator in the private ledger workspace for safe diagnostics."
            exit 1
          fi

      - name: Build private projection without exposing metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! pnpm --filter @beartrace/cli exec node dist/cli.js build-projection \
            --root ../../.beartrace-ledger \
            --config ../../.beartrace-ledger/config/beartrace.config.json \
            --as-of "${{ steps.date.outputs.value }}" \
            --out "$RUNNER_TEMP/projection.json" >"$RUNNER_TEMP/projection-build.log" 2>&1; then
            echo "Private projection build failed. Reproduce it locally for safe diagnostics."
            exit 1
          fi

      - name: Build dashboard for this project site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PAGES_BASE_PATH" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="${PAGES_BASE_PATH%/}/"
          fi
          pnpm --filter @beartrace/dashboard build

      - name: Encrypt projection for public hosting
        env:
          BEARTRACE_PASSPHRASE: ${{ secrets.BEARTRACE_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          node packages/encryption/dist/cli.js \
            --in "$RUNNER_TEMP/projection.json" \
            --out dist/dashboard/dashboard.enc.json >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/projection.json"
          test -s dist/dashboard/dashboard.enc.json
          test ! -e dist/dashboard/dashboard.json

      - name: Upload encrypted Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
