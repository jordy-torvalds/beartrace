name: Validate ledger

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:examples
      - name: Verify deterministic projection
        shell: bash
        run: |
          pnpm build:projection:examples
          cp dist/projection.examples.json /tmp/projection-first.json
          pnpm build:projection:examples
          cmp /tmp/projection-first.json dist/projection.examples.json
